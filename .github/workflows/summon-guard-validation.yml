name: Summon Guard Validation

on:
  pull_request:
    branches: [main, feat/t1-summon-guard-core-20261016, feat/t1-suxia-20261016]
    paths:
      - src/**
      - gradle/**
      - build.gradle
      - gradle.properties
      - tools/**
      - .github/workflows/summon-guard-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: summon-guard-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  summon-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify production mixin targets
        run: python3 tools/verify_mixin_targets.py
      - name: Build and validate resources
        run: bash ./gradlew --no-daemon build
      - name: Run Suxia and RedNails integration regression
        run: bash ./gradlew --no-daemon -PredNailsOnly runGameTestServer
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summon-guard-validation
          path: |
            build/reports/
            build/libs/*.jar
            run/logs/
          if-no-files-found: warn

  real-client-combat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install headless OpenGL and recording support
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libopenal1 ffmpeg
      - name: Compile opt-in client validation fixtures
        run: bash ./gradlew --no-daemon -PredNailsE2E writeRedNailsTestClasspath
      - name: Record both guardians clearing idle zombies
        env:
          SUMMON_GUARD_QA: '1'
          RED_NAILS_QA_TIMEOUT: '600'
        run: python3 tools/red-nails/e2e.py
      - name: Preserve actual client screenshots, video and server assertions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: summon-guard-real-client
          path: |
            build/red-nails-e2e-*/*.png
            build/red-nails-e2e-*/*.mp4
            build/red-nails-e2e-*/*.pass
            build/red-nails-e2e-*/*.failed
            build/red-nails-e2e-*/*.log
          if-no-files-found: warn
