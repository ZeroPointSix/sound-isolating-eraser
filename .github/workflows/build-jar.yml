name: Build mod jar

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-jar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle build (Java 17)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Locate mod jar
        id: jar
        run: |
          set -euo pipefail
          jar="$(find build/libs -maxdepth 1 -type f -name 'sound_isolating_eraser-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"
          if [ -z "${jar}" ]; then
            echo "No sound_isolating_eraser-*.jar found under build/libs" >&2
            ls -la build/libs || true
            exit 1
          fi
          name="$(basename "${jar}")"
          echo "path=${jar}" >> "${GITHUB_OUTPUT}"
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
          echo "Found ${name}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.jar.outputs.name }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jar-main-${{ github.run_number }}
          name: sound_isolating_eraser build ${{ github.run_number }}
          body: |
            Automatic build from `main` (`${{ github.sha }}`).

            Download **`${{ steps.jar.outputs.name }}`** from the Assets below
            (or from the workflow artifact of the same name).
          files: ${{ steps.jar.outputs.path }}
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
