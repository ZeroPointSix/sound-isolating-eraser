name: Neon Tumor validation

on:
  pull_request:
    paths:
      - 'src/main/**'
      - 'src/neonTest/**'
      - 'tools/neon/**'
      - 'gradle/neon-e2e.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/neon-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-validation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python tools/neon/validate-assets.py
      - run: chmod +x gradlew
      - run: ./gradlew test runGameTestServer build --no-daemon --stacktrace
      - run: python tools/neon/verify-gametests.py
      - name: Prepare isolated real-client test driver
        run: ./gradlew -PneonE2E writeNeonTestClasspath --no-daemon
      - name: Exercise rendered monster and real-client lifecycle
        env:
          LP_NUM_THREADS: '2'
        run: python tools/neon/e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neon-validation
          path: |
            build/libs/*.jar
            build/reports/
            run/logs/latest.log
            build/neon-e2e-*/*.log
            build/neon-e2e-*/*.png
            build/neon-e2e-*/*.pass
            build/neon-e2e-*/*.failed
            build/neon-e2e-*/rendered-breathing.txt
            build/neon-e2e-*/client-lighting.txt
