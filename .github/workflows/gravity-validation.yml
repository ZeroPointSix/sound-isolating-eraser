name: Gravity Jade Validation

on:
  push:
    branches: [feature/gravity-jade-pendant]
  pull_request:
    branches: [main, devin/sound-isolating-eraser, feature/flat-mark-server-opts-gha]
    paths:
      - src/**
      - gradle/**
      - build.gradle
      - gradle.properties
      - tools/**
      - .github/workflows/gravity-validation.yml
  workflow_dispatch:
    inputs:
      record_showcase:
        description: Record real-client wings model views and animation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gravity-validation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-game-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build distributable mod
        run: bash ./gradlew --no-daemon build
      - name: Validate reference mesh
        run: python3 tools/validate_wings_mesh.py
      - name: Run Forge integration tests
        run: bash ./gradlew --no-daemon runGameTestServer
      - name: Verify production outline mappings
        run: |
          grep -E 'm_91314_.*shouldEntityAppearGlowing' build/createSrgToMcp/output.srg
          grep -E 'net/minecraft/world/entity/Entity/m_19876_.*getTeamColor' build/createSrgToMcp/output.srg
      - name: Start real client with software rendering
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1280x720x24' bash tools/client-smoke.sh
      - name: Prepare isolated multiplayer test driver
        id: driver
        run: bash ./gradlew --no-daemon -PgravityE2E writeGravityTestClasspath
      - name: Install native X11 input driver
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y xdotool ffmpeg
      - name: Exercise real two-client gameplay
        run: python3 tools/gravity-e2e.py
      - name: Exercise real two-client wings gameplay
        if: ${{ !cancelled() && steps.driver.outcome == 'success' }}
        run: python3 tools/wings-e2e.py
      - name: Record wings model showcase
        if: ${{ !cancelled() && inputs.record_showcase && steps.driver.outcome == 'success' }}
        env:
          LP_NUM_THREADS: '2'
        run: python3 tools/wings-showcase.py
      - name: Preserve build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gravity-jade-validation
          path: |
            build/libs/*.jar
            build/reports/
            build/client-smoke.*
            build/createSrgToMcp/output.srg
            build/gravity-e2e/*.log
            build/gravity-e2e/*.png
            build/gravity-e2e/*.pass
            build/gravity-e2e/*.failed
            build/wings-e2e/*.log
            build/wings-e2e/*.png
            build/wings-e2e/*.pass
            build/wings-e2e/*.failed
            build/wings-showcase/*.log
            build/wings-showcase/*.png
            build/wings-showcase/*.pass
            build/wings-showcase/*.failed
            build/wings-showcase/*.mp4
            run/logs/
          if-no-files-found: warn
