name: Gravity Jade Validation

on:
  push:
    branches: [feature/gravity-jade-pendant]
  pull_request:
    paths:
      - src/**
      - gradle/**
      - build.gradle
      - gradle.properties
      - .github/workflows/gravity-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gravity-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-game-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build distributable mod
        run: bash ./gradlew --no-daemon build
      - name: Run Forge integration tests
        run: bash ./gradlew --no-daemon runGameTestServer
      - name: Preserve build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gravity-jade-validation
          path: |
            build/libs/*.jar
            build/reports/
            run/logs/
          if-no-files-found: warn
