name: Yuji Fodu validation

on:
  pull_request:
    paths:
      - 'src/main/**'
      - 'art/yuji_fodu/**'
      - 'tools/yuji/**'
      - 'src/yujiTest/**'
      - 'gradle/yuji-e2e.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/yuji-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yuji-validation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all models, animation cues and resource references
        run: python tools/yuji/validate_assets.py
      - name: Build and run all Forge GameTests
        run: |
          set -o pipefail
          mkdir -p build
          bash ./gradlew build runGameTestServer --no-daemon --stacktrace 2>&1 | tee build/yuji-gametest.log
          python tools/yuji/verify_gametest_log.py build/yuji-gametest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yuji-validation
          path: |
            build/libs/*.jar
            build/reports/
            run/logs/latest.log
            build/yuji-gametest.log

  client-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare real-client probe
        run: bash ./gradlew -PyujiE2E writeYujiTestClasspath --no-daemon
      - name: Render each profile and exercise sound pipeline
        run: python tools/yuji/e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yuji-client-evidence
          path: |
            build/yuji-e2e-*/*.log
            build/yuji-e2e-*/*.pass
            build/yuji-e2e-*/*.failed
            build/yuji-e2e-*/*.png
