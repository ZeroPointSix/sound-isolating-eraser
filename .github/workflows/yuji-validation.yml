name: Yuji Fodu validation

on:
  pull_request:
    paths:
      - 'src/main/**'
      - 'art/yuji_fodu/**'
      - 'tools/yuji/**'
      - 'src/yujiTest/**'
      - 'gradle/yuji-e2e.gradle'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/yuji-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yuji-validation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all models, animation cues and resource references
        run: |
          python -m unittest discover -s tools/yuji -p 'test_*.py' -v
          python tools/yuji/validate_assets.py
      - name: Build and run all Forge GameTests
        run: |
          set -o pipefail
          mkdir -p build
          bash ./gradlew build runGameTestServer --no-daemon --stacktrace 2>&1 | tee build/yuji-gametest.log
          python tools/yuji/verify_gametest_log.py build/yuji-gametest.log
      - name: Repeat all Forge GameTests in a clean world
        run: |
          set -o pipefail
          rm -rf run/world
          bash ./gradlew runGameTestServer --no-daemon --stacktrace 2>&1 | tee build/yuji-gametest-repeat.log
          python tools/yuji/verify_gametest_log.py build/yuji-gametest-repeat.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yuji-validation
          path: |
            build/libs/*.jar
            build/reports/
            run/logs/latest.log
            build/yuji-gametest*.log

  habitat-negative-control:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unchanged Yuji tests before the negative control
        run: |
          set -o pipefail
          mkdir -p build
          bash ./gradlew -PyujiOnly runGameTestServer --no-daemon --max-workers=1 --console=plain 2>&1 | tee build/yuji-habitat-positive.log
          python tools/yuji/verify_gametest_log.py build/yuji-habitat-positive.log
      - name: Prove habitat movement tests reject a removed production goal
        run: python3 tools/yuji/habitat_negative_control.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yuji-habitat-negative-control
          path: |
            build/yuji-habitat-positive.log
            build/yuji-habitat-negative-*/negative.log
            build/yuji-habitat-negative-*/result.json

  voice-negative-control:
    needs: camera-disabled
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject removed body-discovery reset through real client look input
        run: python3 tools/yuji/voice_negative_control.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yuji-voice-negative-control
          path: |
            build/yuji-voice-negative-*/prepare.log
            build/yuji-voice-negative-*/negative.log
            build/yuji-voice-negative-*/result.json
            build/yuji-voice-negative-*/yuji-isolation-*/*.log
            build/yuji-voice-negative-*/yuji-isolation-*/*.pass
            build/yuji-voice-negative-*/yuji-isolation-*/*.failed
            build/yuji-voice-negative-*/yuji-isolation-*/*.png

  camera-disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare real-client probe
        run: bash ./gradlew -PyujiE2E writeYujiTestClasspath --no-daemon
      - name: Verify disabled camera with natural pull, swapped real clients and source cleanup
        run: YUJI_QA_ISOLATION=1 YUJI_QA_CAMERA_TURN=false python tools/yuji/e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yuji-camera-disabled-evidence
          path: |
            build/yuji-isolation-*/*.log
            build/yuji-isolation-*/*.pass
            build/yuji-isolation-*/*.failed
            build/yuji-isolation-*/*.png
            build/yuji-isolation-*/server/defaultconfigs/qihai-yuji-server.toml
            build/yuji-isolation-*/server/world/serverconfig/qihai-yuji-server.toml

  mechanism-negative-control:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unchanged Yuji tests before the mechanism negative control
        run: |
          set -o pipefail
          mkdir -p build
          bash ./gradlew -PyujiOnly runGameTestServer --no-daemon --max-workers=1 --console=plain 2>&1 | tee build/yuji-mechanism-positive.log
          python tools/yuji/verify_gametest_log.py build/yuji-mechanism-positive.log
      - name: Reject wrong ram victim, stale audience and partial collision walls
        run: python tools/yuji/mechanism_negative_control.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yuji-mechanism-negative-control
          path: |
            build/yuji-mechanism-positive.log
            build/yuji-mechanism-negative-*/negative.log
            build/yuji-mechanism-negative-*/result.json

  client-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real-mixer recording tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Prepare real-client probe
        run: bash ./gradlew -PyujiE2E writeYujiTestClasspath --no-daemon
      - name: Render each profile and exercise sound pipeline
        run: YUJI_QA_RECORD_AUDIO=1 python tools/yuji/e2e.py
      - name: Repeat slow-render and stalled-bite regressions with a real client
        run: |
          for attempt in 1 2; do
            echo "Yuji timing regression attempt ${attempt}"
            YUJI_QA_PROFILES=yuchi,tanyu YUJI_QA_CLIENT_FPS=10 YUJI_QA_FRAME_DELAY_MS=700 \
              YUJI_QA_STALL_BITE=1 YUJI_QA_RECORD_AUDIO=1 python tools/yuji/e2e.py
          done
      - name: Exercise grudge, buffed slashes, chant timing, peel threshold and body contact with two real clients
        run: YUJI_QA_BOUNDARIES=1 python tools/yuji/e2e.py
      - name: Verify targeted audio, camera isolation, doors, climbing and Panda with two real clients
        run: YUJI_QA_ISOLATION=1 YUJI_QA_RECORD_AUDIO=1 python tools/yuji/e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yuji-client-evidence
          path: |
            build/yuji-e2e-*/*.log
            build/yuji-e2e-*/*.pass
            build/yuji-e2e-*/*.failed
            build/yuji-e2e-*/*.png
            build/yuji-e2e-*/*.ogg
            build/yuji-e2e-*/*-mix.wav
            build/yuji-boundaries-*/*.log
            build/yuji-boundaries-*/*.pass
            build/yuji-boundaries-*/*.failed
            build/yuji-boundaries-*/*.png
            build/yuji-isolation-*/*.log
            build/yuji-isolation-*/*.pass
            build/yuji-isolation-*/*.failed
            build/yuji-isolation-*/*.png
            build/yuji-isolation-*/*.ogg
            build/yuji-isolation-*/*-mix.wav
