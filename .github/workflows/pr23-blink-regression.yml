name: PR23 Blink Regression Proof

on:
  push:
    branches: [verify/zer1420-pr21-pr22-pr23-20261012]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  old-fails-new-passes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prove both old endpoint failures and both repaired passes
        shell: bash
        run: |
          set -euo pipefail
          source=src/main/java/com/zeropointsix/eraser/wings/BlinkDestination.java
          mkdir -p build/blink-regression
          cp "$source" build/blink-regression/BlinkDestination.fixed.java
          trap 'cp build/blink-regression/BlinkDestination.fixed.java "$source"' EXIT
          git show 485d22628d088bd69116c71f4f7af0f310b945d8:"$source" > "$source"
          set +e
          bash ./gradlew --no-daemon --max-workers=2 -PblinkOnly runGameTestServer 2>&1 | tee build/blink-regression/baseline.log
          baseline_exit=${PIPESTATUS[0]}
          set -e
          cp build/blink-regression/BlinkDestination.fixed.java "$source"
          test "$baseline_exit" -ne 0
          grep -F 'forwardendpoint failed! a shared segment endpoint must stop before the wall' build/blink-regression/baseline.log
          grep -F 'reverseendpoint failed! a shared segment endpoint must stop before the wall' build/blink-regression/baseline.log
          grep -F '2 required tests failed' build/blink-regression/baseline.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          log = Path('build/blink-regression/baseline.log').read_text()
          for name in ('forwardendpoint', 'reverseendpoint'):
              distances = re.findall(name + r' failed! a shared segment endpoint must stop before the wall, not cross it: ([0-9.Ee+-]+)', log)
              assert len(distances) == 1 and 7.99 < float(distances[0]) < 8.01, (name, distances)
          PY
          if test -d run/world; then mv run/world build/blink-regression/baseline-world; fi
          bash ./gradlew --no-daemon --max-workers=2 -PblinkOnly runGameTestServer 2>&1 | tee build/blink-regression/repaired.log
          grep -F 'All 2 required tests passed' build/blink-regression/repaired.log
          echo 'BLINK_REGRESSION_PROVED old=2_failed new=2_passed'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr23-blink-regression-proof
          retention-days: 7
          path: |
            build/blink-regression/*.log
            build/reports/
            run/logs/
