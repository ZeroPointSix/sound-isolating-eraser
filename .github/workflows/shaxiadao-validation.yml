name: Shaxiadao Validation

on:
  pull_request:
    branches: [main, feature/enhancement-pill-pack]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shaxiadao-validation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run real Forge tests
        run: bash ./gradlew --no-daemon --max-workers=2 build runGameTestServer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shaxiadao-validation
          retention-days: 7
          path: |
            build/libs/*.jar
            build/reports/
            run/logs/
