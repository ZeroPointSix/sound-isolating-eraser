name: Shaxiadao Validation

on:
  pull_request:
    branches: [main, feature/enhancement-pill-pack]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shaxiadao-validation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run real Forge tests
        run: bash ./gradlew --no-daemon --max-workers=2 build runGameTestServer
      - name: Install native client test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool libgl1-mesa-dri
      - name: Compile isolated client test driver
        run: bash ./gradlew --no-daemon --max-workers=2 -PshaxiaE2E writeShaxiaTestClasspath
      - name: Verify two native clients and server restart
        run: python3 tools/shaxia-e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shaxiadao-validation
          retention-days: 7
          path: |
            build/libs/*.jar
            build/reports/
            run/logs/
            build/shaxia-e2e/*.pass
            build/shaxia-e2e/*.failed
            build/shaxia-e2e/*.log
            build/shaxia-e2e/*.png
