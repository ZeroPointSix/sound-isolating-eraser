name: Brickrot Validation

on:
  pull_request:
    branches: [main]
    paths:
      - '**/brickrot/**'
      - '**/*[Bb]rickrot*'
      - build.gradle
      - gradle.properties
      - src/main/resources/META-INF/mods.toml
      - .github/workflows/brickrot-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brickrot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and run real Forge server tests
        run: bash ./gradlew --no-daemon --max-workers=2 compileJava runGameTestServer
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brickrot-server-evidence
          path: |
            run/logs/latest.log
            run/logs/debug.log
            build/reports/
          if-no-files-found: warn

  supplied-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require the original models, animations and textures
        run: python3 tools/brickrot-assets.py verify
