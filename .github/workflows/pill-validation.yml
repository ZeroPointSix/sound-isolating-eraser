name: Enhancement Pill Validation

on:
  pull_request:
    branches: [main, feature/eraser-gravity-round2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pill-validation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check exact approved texture export
        run: |
          python3 tools/pill/export-assets.py
          git diff --exit-code -- src/main/resources/assets
      - name: Build and run all Forge integration tests
        run: bash ./gradlew --no-daemon build runGameTestServer
      - name: Launch real client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1280x720x24' bash tools/client-smoke.sh
      - name: Prepare isolated pill test driver
        run: bash ./gradlew --no-daemon -PpillE2E writePillTestClasspath
      - name: Install native input driver
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y xdotool
      - name: Exercise two real clients and server restart
        run: python3 tools/pill-e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enhancement-pill-validation
          path: |
            build/libs/*.jar
            build/reports/
            build/client-smoke.*
            build/pill-e2e/*.log
            build/pill-e2e/*.png
            build/pill-e2e/*.pass
            build/pill-e2e/*.failed
            run/logs/
