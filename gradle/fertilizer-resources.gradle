import groovy.json.JsonOutput

apply from: 'gradle/fertilizer-art.gradle'

def fertileOutput = layout.buildDirectory.dir('generated/fertilizer-resources')
sourceSets.main.resources.srcDir(fertileOutput)

tasks.register('generateFertilizerResources') {
    inputs.file('gradle/fertilizer-art.gradle')
    outputs.dir(fertileOutput)
    doLast {
        def root = fertileOutput.get().asFile
        def ns = 'sound_isolating_eraser'
        def json = { String path, Object value ->
            def target = new File(root, path)
            target.parentFile.mkdirs()
            target.text = JsonOutput.prettyPrint(JsonOutput.toJson(value)) + '\n'
        }
        def asset = "assets/${ns}"
        def data = "data/${ns}"
        def arena = new File(root, "${data}/structures/fertilizer_arena.nbt")
        arena.parentFile.mkdirs()
        def nbt = new DataOutputStream(new java.util.zip.GZIPOutputStream(new FileOutputStream(arena)))
        nbt.writeByte(10); nbt.writeUTF('')
        nbt.writeByte(3); nbt.writeUTF('DataVersion'); nbt.writeInt(3465)
        nbt.writeByte(9); nbt.writeUTF('size'); nbt.writeByte(3); nbt.writeInt(3)
        [80,48,80].each { nbt.writeInt(it) }
        nbt.writeByte(9); nbt.writeUTF('palette'); nbt.writeByte(10); nbt.writeInt(1)
        nbt.writeByte(8); nbt.writeUTF('Name'); nbt.writeUTF('minecraft:air'); nbt.writeByte(0)
        ['blocks','entities'].each { nbt.writeByte(9); nbt.writeUTF(it); nbt.writeByte(10); nbt.writeInt(0) }
        nbt.writeByte(0); nbt.close()
        ['fertile_log', 'fertile_leaves', 'fertile_planks', 'fertile_sapling'].each { name ->
            def model = name == 'fertile_sapling' ? 'cross' : name == 'fertile_log' ? 'cube_column' : 'cube_all'
            def textures = model == 'cross' ? [cross:"${ns}:block/${name}"] : model == 'cube_column'
                    ? [side:"${ns}:block/${name}", end:"${ns}:block/fertile_log_top"] : [all:"${ns}:block/${name}"]
            def content = [parent:"minecraft:block/${model}", textures:textures]
            if (name == 'fertile_sapling') content.render_type = 'minecraft:cutout'
            if (name == 'fertile_leaves') content = bushyLeaves("${ns}:block/${name}", "${ns}:block/${name}_fringe")
            json("${asset}/models/block/${name}.json", content)
            // 原版惯例：树苗在物品栏里显示平面贴图，而不是十字方块模型
            json("${asset}/models/item/${name}.json", name == 'fertile_sapling'
                    ? [parent:'minecraft:item/generated', textures:[layer0:"${ns}:block/${name}"]] : [parent:"${ns}:block/${name}"])
            def m = "${ns}:block/${name}"
            if (name == 'fertile_leaves') json("${asset}/models/block/${name}_fruiting.json",
                    bushyLeaves("${ns}:block/${name}", "${ns}:block/${name}_fringe", "${ns}:block/${name}_fruit"))
            // 竖放原木随机转 0/90/180/270，打散成片原木墙和树干的重复感
            def variants = name == 'fertile_log' ? ['axis=y':[0, 90, 180, 270].collect { it ? [model:m, y:it] : [model:m] }, 'axis=x':[model:m,x:90,y:90], 'axis=z':[model:m,x:90]]
                    // 约四分之一的树叶挂着 3D 小果，按坐标随机，不会排成网格
                    : name == 'fertile_leaves' ? ['':[[model:m, weight:3], [model:"${m}_fruiting", weight:1]]] : ['':[model:m]]
            json("${asset}/blockstates/${name}.json", [variants:variants])
            if (name != 'fertile_leaves') json("${data}/loot_tables/blocks/${name}.json", [type:'minecraft:block',pools:[[rolls:1,entries:[[type:'minecraft:item',name:"${ns}:${name}"]],conditions:[[condition:'minecraft:survives_explosion']]]]])
        }
        def toolCondition = [condition:'minecraft:any_of',terms:[
                [condition:'minecraft:match_tool',predicate:[items:['minecraft:shears']]],
                [condition:'minecraft:match_tool',predicate:[enchantments:[[enchantment:'minecraft:silk_touch',levels:[min:1]]]]]]]
        def naturalDrop = { String name, List chances ->
            [type:'minecraft:item',name:"${ns}:${name}",conditions:[
                [condition:'minecraft:survives_explosion'],
                [condition:'minecraft:table_bonus',enchantment:'minecraft:fortune',chances:chances]]]
        }
        def leafAlternatives = [type:'minecraft:alternatives',children:[
            [type:'minecraft:item',name:"${ns}:fertile_leaves",conditions:[toolCondition]],
            naturalDrop('fertile_sapling',[0.05,0.0625,0.083333336,0.1])]]
        def fruitPool = [rolls:1,conditions:[[condition:'minecraft:inverted',term:toolCondition]],
                entries:[naturalDrop('fertile_fruit',[0.02,0.025,0.033333335,0.1])]]
        json("${data}/loot_tables/blocks/fertile_leaves.json", [type:'minecraft:block',pools:[[rolls:1,entries:[leafAlternatives]],fruitPool]])
        json("${data}/recipes/fertile_planks.json", [type:'minecraft:crafting_shapeless',ingredients:[[item:"${ns}:fertile_log"]],result:[item:"${ns}:fertile_planks",count:4]])
        json("${data}/tags/blocks/fertile_blocks.json", [replace:false,values:['fertile_log','fertile_leaves','fertile_planks'].collect { "${ns}:${it}" }])
        [logs:['fertile_log'],logs_that_burn:['fertile_log'],leaves:['fertile_leaves'],planks:['fertile_planks'],saplings:['fertile_sapling'], 'mineable/axe':['fertile_log','fertile_planks'], 'mineable/hoe':['fertile_leaves']].each { tag, names ->
            json("data/minecraft/tags/blocks/${tag}.json", [replace:false,values:names.collect { "${ns}:${it}" }])
            if (!tag.contains('/')) json("data/minecraft/tags/items/${tag}.json", [replace:false,values:names.collect { "${ns}:${it}" }])
        }
        ['empty_fertilizer_bag','fertile_fruit'].each { name ->
            json("${asset}/models/item/${name}.json", [parent:'minecraft:item/generated',textures:[layer0:"${ns}:item/${name}"]])
        }
        // 超级肥料袋：物品栏用 32×32 平面贴图（功能稿 2.6），手持/掉落/展示框用 3D 鼓包袋
        json("${asset}/models/item/super_fertilizer_bag_flat.json", [parent:'minecraft:item/generated',textures:[layer0:"${ns}:item/super_fertilizer_bag"]])
        json("${asset}/models/item/super_fertilizer_bag_3d.json", bagModel("${ns}:item/super_fertilizer_bag_model", "${ns}:item/super_fertilizer_bag"))
        json("${asset}/models/item/super_fertilizer_bag.json", [loader:'forge:separate_transforms',
                base:[parent:"${ns}:item/super_fertilizer_bag_3d"],
                perspectives:[gui:[parent:"${ns}:item/super_fertilizer_bag_flat"]]])
        paintFertilizerArt(new File(root, "${asset}/textures"))
    }
}
tasks.named('processResources').configure { dependsOn('generateFertilizerResources') }
