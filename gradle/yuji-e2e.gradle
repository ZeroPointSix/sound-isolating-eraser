// Opt-in probe mod, excluded from the player jar.
sourceSets {
    yujiTest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
minecraft.runs.matching { it.name == 'client' || it.name == 'server' }.configureEach {
    mods { yuji_qa { source sourceSets.yujiTest } }
}
tasks.register('writeYujiTestClasspath') {
    dependsOn 'classes', 'yujiTestClasses', 'genVSCodeRuns'
    def target = layout.buildDirectory.file('yuji-test-classpath.txt')
    outputs.file(target)
    doLast { target.get().asFile.text = sourceSets.yujiTest.runtimeClasspath.asPath }
}
