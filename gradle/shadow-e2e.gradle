// Opt-in real-client checks stay outside the production source set and jar.
sourceSets {
    shadowTest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
minecraft.runs.configureEach {
    mods { shadow_qa { source sourceSets.shadowTest } }
}
tasks.register('writeShadowTestClasspath') {
    dependsOn 'classes', 'shadowTestClasses', 'genVSCodeRuns'
    def target = layout.buildDirectory.file('shadow-test-classpath.txt')
    outputs.file(target)
    doLast { target.get().asFile.text = sourceSets.shadowTest.runtimeClasspath.asPath }
}
