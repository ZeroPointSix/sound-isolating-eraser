// Opt-in real-client test driver, excluded from the production jar.
sourceSets {
    shaxiaTest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
minecraft.runs.configureEach {
    mods {
        shaxia_qa { source sourceSets.shaxiaTest }
    }
}
tasks.register('writeShaxiaTestClasspath') {
    dependsOn 'classes', 'shaxiaTestClasses', 'genVSCodeRuns'
    def target = layout.buildDirectory.file('shaxia-test-classpath.txt')
    outputs.file(target)
    doLast { target.get().asFile.text = sourceSets.shaxiaTest.runtimeClasspath.asPath }
}
