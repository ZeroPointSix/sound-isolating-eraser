// Opt-in real-client test driver, excluded from the production jar.
sourceSets {
    keeperTest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
minecraft.runs.configureEach {
    mods {
        keeper_qa { source sourceSets.keeperTest }
    }
}
// Test the exact named-mapping input to reobfJar, not loose/stale development classes.
tasks.named('jar', Jar).configure {
    def runtimeJar = layout.buildDirectory.file('keeper-runtime/keeper-runtime.jar')
    outputs.file(runtimeJar)
    doLast {
        copy {
            from archiveFile
            into runtimeJar.get().asFile.parentFile
            rename { 'keeper-runtime.jar' }
        }
    }
}
tasks.register('writeKeeperTestClasspath') {
    dependsOn 'classes', 'keeperTestClasses', 'genVSCodeRuns'
    def target = layout.buildDirectory.file('keeper-test-classpath.txt')
    outputs.file(target)
    doLast { target.get().asFile.text = sourceSets.keeperTest.runtimeClasspath.asPath }
}
