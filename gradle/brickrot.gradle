def verifyBrickrotAssets = tasks.register('verifyBrickrotAssets', Exec) {
    commandLine 'python3', 'tools/brickrot-assets.py', 'verify'
}
tasks.named('check').configure { dependsOn verifyBrickrotAssets }
tasks.named('jar').configure { dependsOn verifyBrickrotAssets }

def brickrotTestResources = layout.buildDirectory.dir('generated/brickrot-test-resources')
def generateBrickrotTestTemplate = tasks.register('generateBrickrotTestTemplate') {
    outputs.dir(brickrotTestResources)
    doLast {
        [brickrot_empty: 16, brickrot_burrow: 48].each { template, height ->
            def file = brickrotTestResources.get().file("data/sound_isolating_eraser/structures/${template}.nbt").asFile
            file.parentFile.mkdirs()
            new DataOutputStream(new java.util.zip.GZIPOutputStream(new FileOutputStream(file))).withCloseable { out ->
                out.writeByte(10); out.writeUTF('')
                out.writeByte(3); out.writeUTF('DataVersion'); out.writeInt(3465)
                out.writeByte(9); out.writeUTF('size'); out.writeByte(3); out.writeInt(3)
                [64, height, 64].each { out.writeInt(it) }
                out.writeByte(9); out.writeUTF('palette'); out.writeByte(10); out.writeInt(1)
                out.writeByte(8); out.writeUTF('Name'); out.writeUTF('minecraft:air'); out.writeByte(0)
                ['blocks', 'entities'].each { name ->
                    out.writeByte(9); out.writeUTF(name); out.writeByte(10); out.writeInt(0)
                }
                out.writeByte(0)
            }
        }
    }
}
sourceSets.main.resources.srcDir(brickrotTestResources)
tasks.named('processResources').configure { dependsOn generateBrickrotTestTemplate }
tasks.named('jar').configure { exclude 'data/sound_isolating_eraser/structures/brickrot_*.nbt' }
